; Loaded after the default www.conf (glob is alphabetical, "zz" sorts last),
; so these override its pm.* values for the [www] pool.
;
; Default pm.max_children=5 starves under Filament's dashboard, which lazy-loads
; ~17 widgets as near-simultaneous Livewire requests on page load. Combined with
; session request blocking (each waiting request holds its worker), the pool
; exhausted within seconds of login and dropped requests back to guest state.
[www]

pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
